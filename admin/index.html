<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Автотека — управление отчётами</title><link rel="stylesheet" href="style.css">
<script src="config.js" defer></script><script src="app.js" defer></script></head>
<body><main>
<header><h1>Отчёты автомобилей</h1><button id="refresh" hidden>Обновить список</button></header>
<p id="status" role="status" aria-live="polite"></p>
<form id="login">
<label>Пароль админки<input id="password" type="password" required autocomplete="current-password"></label>
<button class="primary">Войти</button>
</form>
<div id="workspace" hidden><button id="logout" type="button">Выйти</button>
<section id="reports" aria-label="Список отчётов"></section>
<section id="editor"><h2 id="form-title">Добавить автомобиль</h2>
<form id="save">
<label>Адрес папки<input id="slug" required pattern="[a-z0-9][a-z0-9\-]{0,99}" placeholder="audi-a6-2017"></label>
<label>HTML отчёта<input id="html" type="file" accept=".html,.htm"></label>
<label>Папка assets<input id="assets" type="file" webkitdirectory multiple></label>
<p class="hint">Для правок скачайте отчёт, откройте его в редакторе и загрузите сохранённый HTML. Для замены фото выберите папку assets. Лимит загрузки — 20 МБ.</p>
<button class="primary" type="submit">Сохранить в GitHub</button>
<button type="button" id="reset">Новый отчёт</button>
</form></section>
</div></main></body></html>
