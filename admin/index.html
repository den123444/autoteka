<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Автотека — управление отчётами</title><link rel="stylesheet" href="style.css">
<script src="config.js" defer></script><script src="app.js?v=history3" defer></script></head>
<body><main>
<header><h1>Отчёты автомобилей</h1><button id="refresh" hidden>Обновить список</button></header>
<p id="status" role="status" aria-live="polite"></p>
<form id="login">
<label>Пароль админки<input id="password" type="password" required autocomplete="current-password"></label>
<p><label style="display:inline-flex;align-items:center"><input id="remember" type="checkbox" style="width:auto">Сохранить вход на 7 дней</label></p><button class="primary">Войти</button>
</form>
<div id="workspace" hidden><button id="logout" type="button">Выйти</button>
<section id="reports" aria-label="Список отчётов"></section>
<section id="publications" hidden aria-label="Публикация GitHub Pages">
<h2>Публикация на сайте</h2><div id="publication-list" role="status" aria-live="polite"></div>
</section>
<section aria-label="История изменений">
<h2>Последние изменения</h2><button id="history-refresh" type="button">Обновить историю</button>
<button id="history-restore" type="button" hidden>Вернуть скрытые записи</button>
<p id="history-status" role="status"></p><div id="history-list"></div>
</section>
<section id="editor"><h2 id="form-title">Добавить автомобиль</h2>
<form id="save">
<label>Адрес папки<input id="slug" required pattern="[a-z0-9][a-z0-9\-]{0,99}" placeholder="audi-a6-2017"></label>
<div id="source-field" hidden>
<button type="button" id="visual-open">Открыть визуальный редактор</button>
<dialog id="visual-dialog" style="width:98vw;max-width:none;height:96vh;padding:8px;border:1px solid #bcc7d6;border-radius:12px">
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
<button type="button" id="visual-close">Назад к списку</button>
<button type="button" class="primary" id="visual-apply">Применить правки</button>
</div>
<iframe id="visual-frame" title="Визуальный редактор отчёта" style="width:100%;height:calc(100% - 54px);border:0"></iframe>
</dialog></div>
<label>Заменить HTML файлом<input id="html" type="file" accept=".html,.htm"></label>
<label>Папка assets<input id="assets" type="file" webkitdirectory multiple></label>
<p class="hint">Отредактируйте отчёт в визуальном редакторе или выберите готовый HTML. Если выбран файл, будет сохранён он. Для замены фото выберите папку assets. Лимит загрузки — 20 МБ.</p>
<button class="primary" type="submit">Сохранить в GitHub</button>
<button type="button" id="new-report">Новый отчёт</button>
</form></section>
</div></main></body></html>
